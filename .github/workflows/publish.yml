name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.event.release.target_commitish == 'main'
    environment: npm-publish
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # Trusted Publishing (OIDC) — same pattern as the other @bagdock
      # packages. No NPM_TOKEN: npm 11.5+ exchanges the Actions OIDC token
      # directly. registry-url is omitted on purpose: setup-node would write
      # an .npmrc expecting NODE_AUTH_TOKEN, and an empty token fails auth
      # before OIDC is attempted (the v0.2.0 ENEEDAUTH failure).
      - run: npx npm@latest publish --provenance --access public
